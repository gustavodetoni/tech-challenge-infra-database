name: Deploy

on:
  workflow_dispatch:
  # Deploy automatico desabilitado no primeiro push do repositorio.
  # Reativar quando as variaveis AWS/Terraform/database estiverem configuradas.
  # push:
  #   branches:
  #     - homolog
  #     - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: Deploy Database Infra
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=tech-challenge/database/${{ github.ref_name }}.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        env:
          TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_k8s_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_k8s_state_key: tech-challenge/k8s/${{ github.ref_name }}.tfstate
          TF_VAR_k8s_state_region: ${{ env.AWS_REGION }}
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Print database outputs
        run: |
          terraform -chdir=terraform output database_host
          terraform -chdir=terraform output database_port
          terraform -chdir=terraform output database_name
